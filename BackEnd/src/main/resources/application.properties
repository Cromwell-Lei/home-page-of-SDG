spring.application.name=backend

# ========== Database Configuration ==========
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sdg_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========== Security ==========
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD}

# ========== Email Configuration ==========
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.qq.com}

# 收件邮箱(接收联系表单的邮箱)
app.mail.recipient=${MAIL_RECIPIENT:connect@chuchiangdata.cc}

# ========== Cloudflare Turnstile 配置 ==========
cloudflare.turnstile.secret-key=${TURNSTILE_SECRET_KEY}
cloudflare.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify

# ========== CORS 配置 ==========
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1}

